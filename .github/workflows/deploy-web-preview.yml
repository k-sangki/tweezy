name: Deploy web preview

on:
  push:
    branches: [main]
    paths:
      - 'app-mobile/**'
      - 'core/**'
      - 'ui/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web-preview.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx expo export --platform web --output-dir dist
        working-directory: app-mobile

      # The export is a single-page bundle, but GitHub Pages has no SPA
      # fallback - refreshing on /tweezy/screener would 404. Serving the same
      # document as 404.html lets the router pick the route up client-side.
      - run: cp dist/index.html dist/404.html
        working-directory: app-mobile

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
