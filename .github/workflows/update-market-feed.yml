name: Update market feed

on:
  schedule:
    # 09:45 UTC = 18:45 KST. Weekdays refresh prices/수급/공매도/기술적 지표
    # only (--skip-financials below) - 재무제표(DART) is quarterly/annual, so
    # re-fetching it every weekday would burn OpenDART's daily quota for
    # identical data. Sunday does the full run, including a fresh DART pull.
    - cron: '45 9 * * 1-5'
    - cron: '45 9 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          # collect_quotes.py runs with the repo root as cwd, so its default
          # cache paths (.cache/dart_reports.json, .cache/kr_price_history.pkl)
          # resolve here. The whole dir is cached so three things survive a run:
          # the corp_code map (without it, cached reports can't be matched back
          # to tickers when DART is skipped or unavailable), the DART report
          # store weekday runs read from without hitting the network (see
          # --skip-financials above), and ~50MB of daily OHLCV - which turns
          # the price history step from ~2,700 full-year fetches into a
          # one-session tail fetch.
          path: .cache
          key: collector-cache-${{ github.run_id }}
          restore-keys: |
            collector-cache-
            dart-financials-

      - run: pip install -r data-pipeline/requirements.txt

      - name: Collect market feed
        run: |
          # Only the weekday cron skips DART; workflow_dispatch and the
          # Sunday cron both do a full run (github.event.schedule is unset
          # for a manual run, so this falls through to the full-run branch).
          if [ "${{ github.event.schedule }}" = "45 9 * * 1-5" ]; then
            python data-pipeline/collect_quotes.py --output data/kr-quotes.json --skip-financials
          else
            python data-pipeline/collect_quotes.py --output data/kr-quotes.json
          fi
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kr-quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update market feed"
          # Collection takes several minutes, so main may have moved on since
          # checkout. Rebase before pushing (this job only ever touches
          # data/kr-quotes.json, so there's nothing to conflict with) and retry
          # in case another push lands in the gap - otherwise a whole run's
          # worth of collected data is thrown away by a rejected push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying..."
            sleep 5
          done
          exit 1
