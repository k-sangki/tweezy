name: Update market feed

on:
  schedule:
    # 09:45 UTC = 18:45 KST, weekdays - after KRX close, same cadence rs-screener uses
    - cron: '45 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          # collect_quotes.py runs with the repo root as cwd, so its default
          # --financials-cache path (.cache/dart_financials.json) resolves here.
          # The whole dir is cached so the corp_code map survives too - without
          # it, cached financials can't be matched back to tickers on a day when
          # DART's quota is already spent.
          path: .cache
          key: dart-financials-${{ github.run_id }}
          restore-keys: |
            dart-financials-

      - run: pip install -r data-pipeline/requirements.txt

      - run: python data-pipeline/collect_quotes.py --output data/kr-quotes.json
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kr-quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update market feed"
          git push
