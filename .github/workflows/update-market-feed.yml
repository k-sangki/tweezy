name: Update market feed

on:
  schedule:
    # 09:45 UTC = 18:45 KST, weekdays - after KRX close, same cadence rs-screener uses
    - cron: '45 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r data-pipeline/requirements.txt

      - run: python data-pipeline/collect_quotes.py --output data/kr-quotes.json
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kr-quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update market feed"
          git push
