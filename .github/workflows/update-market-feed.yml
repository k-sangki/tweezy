name: Update market feed

on:
  schedule:
    # 09:45 UTC = 18:45 KST, weekdays - after KRX close, same cadence rs-screener uses
    - cron: '45 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          # collect_quotes.py runs with the repo root as cwd, so its default
          # cache paths (.cache/dart_financials.json, .cache/kr_price_history.pkl)
          # resolve here. The whole dir is cached so three things survive a run:
          # the corp_code map (without it, cached financials can't be matched back
          # to tickers on a day when DART's quota is already spent), the collected
          # financials, and ~50MB of daily OHLCV - which turns the price history
          # step from ~2,700 full-year fetches into a one-session tail fetch.
          path: .cache
          key: collector-cache-${{ github.run_id }}
          restore-keys: |
            collector-cache-
            dart-financials-

      - run: pip install -r data-pipeline/requirements.txt

      - run: python data-pipeline/collect_quotes.py --output data/kr-quotes.json
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kr-quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update market feed"
          # Collection takes several minutes, so main may have moved on since
          # checkout. Rebase before pushing (this job only ever touches
          # data/kr-quotes.json, so there's nothing to conflict with) and retry
          # in case another push lands in the gap - otherwise a whole run's
          # worth of collected data is thrown away by a rejected push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying..."
            sleep 5
          done
          exit 1
